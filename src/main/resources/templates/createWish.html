<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Wishlist</title>
  <link rel="stylesheet" href="../static/styles.css" th:href="@{styles.css}">
</head>
<body>
<header>
  <div class="container">

    <nav class="row" >
      <a href="index.html" th:href="@{/}" class="logo">
        <img src="../static/img/logo.png" th:src="@{/img/logo.png}" class="logo-img" alt="CallDibs logo">
      </a>
      <a class="logo">CallDibs </a>
      <span>Mine ønskelister</span>

    </nav>

    <div class="section">
      <p class="label">Små ønsker. Store smil.</p>

      <h1>
        Gør plads til det,<br>
        du glæder dig til.
      </h1>

      <p>
        Saml dine ønsker ét sted, og gør det nemt<br>
        for dine nærmeste at finde den rette gave.
      </p>

      <a class="btn btn-light" href="#ny-liste">
        + Opret ønskeliste
      </a>
    </div>

  </div>
</header>
<div class="create-box">
  <div class="create-box-form">
    <h2 >Create a new wish</h2>
    <form th:action="@{/saveCreateWish}" method="post">
      <input type="hidden" name="wishlistId" th:value="${wishlistId}">
      <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter name of wish" required>
      </div>
      <div>
      <label for="description">Description:</label>
      <input type="text" id="description" name="description" placeholder="Enter Description of wish" required>
      </div>
      <div>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" placeholder="Enter Price in Dkk" required>
      </div>
      <div>
        <label for="link">Link:</label>
        <input type="text" id="link" name="link" placeholder="Copy and paste link to your wish" required>
      </div>
      <div>
        <label for="category">Category:</label>
        <select id="category" name="category" required>
          <option value="">-- Select category --</option>
          <option value="Electronics">Electronics</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Clothing">Clothing</option>
          <option value="Sports">Sports</option>
          <option value="Books">Books</option>
          <option value="Toys">Toys</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button class="btn-light, btn" type="submit">Create Wish</button>

    </form>
  </div>
</div>
</body>
<footer>
  <div class="container row">

    <div>
      <a class="logo" href="index.html">CallDibs</a>
      <p class="text-muted text-small">Plads til dine ønsker.</p>
    </div>

    <p class="text-muted text-small">Saml. Ønsk. Del glæden.</p>

    <span class="text-muted text-small">© 2026 CallDibs</span>

  </div>
</footer>
</html>
