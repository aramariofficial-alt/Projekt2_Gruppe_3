<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Wishlist</title>
  <link rel="stylesheet" href="../static/styles.css" th:href="@{styles.css}">
</head>
<body>
<header>
  <h1>CallDibs</h1>
  <p>Saml dine ønsker. Del glæden.</p>
  <hr>
  <nav aria-label="Administrer ønskelister">
  </nav>
</header>
<div class="create-box">
  <div class="create-box-form">
    <h2 class="rødskrift">Create a New wish</h2>
    <form th:action="@{/}" method="post">
      <div>
      <label class="rødskrift" for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter name of wish" required>
      </div>
      <div>
      <label class="rødskrift" for="description">Description:</label>
      <input type="text" id="description" name="description" placeholder="Enter Description of wish" required>
      </div>
      <div>
        <label class="rødskrift" for="price">Price:</label>
        <input type="number" id="price" name="price" placeholder="Enter Price in Dkk" required>
      </div>
      <div>
        <label class="rødskrift" for="link">Link:</label>
        <input type="text" id="link" name="link" placeholder="Copy and paste link to your wish" required>
      </div>
      <div>
        <label class="rødskrift" for="category">Category:</label>
        <select id="category" name="category" required>
          <option value="">-- Select category --</option>
          <option value="Electronics">Electronics</option>
          <option value="Gaming">Gaming</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Clothing">Clothing</option>
          <option value="Sports">Sports</option>
          <option value="Books">Books</option>
          <option value="Toys">Toys</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button type="submit">Create Wish</button>
    </form>
  </div>
</div>
</body>
</html>
