<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Wishlist</title>
  <link rel="stylesheet" href="../static/styles.css" th:href="@{styles.css}">
</head>
<body>
<header>
  <div class="container">

    <nav class="row" >
      <a href="index.html" th:href="@{/}" class="logo">
        <img src="../static/img/logo.png" th:src="@{/img/logo.png}" class="logo-img" alt="CallDibs logo">
      </a>
      <a class="logo">CallDibs </a>
      <span> </span>

    </nav>

    <div class="section">
      <p class="label">Små ønsker. Store smil.</p>

      <h1>
        Gør plads til det,<br>
        du glæder dig til.
      </h1>

      <p>
        Saml dine ønsker ét sted, og gør det nemt<br>
        for dine nærmeste at finde den rette gave.
      </p>

      <a class="btn btn-light" href="#ny-liste">
        + Opret ønskeliste
      </a>
    </div>

  </div>
</header>
<div class="create-box">
  <div class="create-box-form">
    <h2>Opret et nyt ønske</h2>

    <form th:action="@{/saveCreateWish}" method="post">
      <input
              type="hidden"
              name="wishlistId"
              th:value="${wishlistId}"
      >

      <div>
        <label for="name">Navn:</label>
        <input
                type="text"
                id="name"
                name="name"
                placeholder="Skriv ønskets navn"
                required
        >
      </div>

      <div>
        <label for="description">Beskrivelse:</label>
        <input
                type="text"
                id="description"
                name="description"
                placeholder="Beskriv dit ønske"
                required
        >
      </div>

      <div>
        <label for="price">Pris:</label>
        <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                placeholder="Angiv prisen i kroner"
                required
        >
      </div>

      <div>
        <label for="link">Link:</label>
        <input
                type="text"
                id="link"
                name="link"
                placeholder="Indsæt et link til dit ønske"
                required
        >
      </div>

      <div>
        <label for="category">Kategori:</label>
        <select id="category" name="category" required>
          <option value="">-- Vælg kategori --</option>
          <option value="Electronics">Elektronik</option>
          <option value="Kitchen">Køkken</option>
          <option value="Clothing">Tøj</option>
          <option value="Sports">Sport</option>
          <option value="Books">Bøger</option>
          <option value="Toys">Legetøj</option>
          <option value="Other">Andet</option>
        </select>
      </div>

      <button class="btn" type="submit">
        Opret ønske
      </button>
    </form>
  </div>
</div>
</body>
<footer>
  <div class="container row">

    <div>
      <a class="logo" href="index.html">CallDibs</a>
      <p class="text-muted text-small">Plads til dine ønsker.</p>
    </div>

    <p class="text-muted text-small">Saml. Ønsk. Del glæden.</p>

    <span class="text-muted text-small">© 2026 CallDibs</span>

  </div>
</footer>
</html>
