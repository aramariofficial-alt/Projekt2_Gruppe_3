<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Opret ønskeliste</title>
    <link href="../static/styles.css" rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header>
    <div class="container">

        <nav class="row" >
            <a href="index.html" th:href="@{/}" class="logo">
                <img src="../static/img/logo.png" th:src="@{/img/logo.png}" class="logo-img" alt="CallDibs logo">
            </a>
            <a class="logo">CallDibs </a>
            <span> </span>

        </nav>

        <div class="section">
            <p class="label">Små ønsker. Store smil.</p>
        </div>

    </div>
</header>

<div class="create-box">
    <div class="create-box-form">
        <h2>Opret en ny ønskeliste</h2>
        <form method="post" th:action="@{/saveCreateWishlist}">
            <div>
                <label for="name">Navn:</label>

                <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Skriv ønskelistens navn"
                        required
                >
            </div>

            <button class="btn" type="submit">
                Opret ønskeliste
            </button>
        </form>
    </div>
</div>
</body>

<footer>
    <div class="container row">

        <div>
            <a class="logo" href="index.html">CallDibs</a>
            <p class="text-muted text-small">Plads til dine ønsker.</p>
        </div>

        <p class="text-muted text-small">Saml. Ønsk. Del glæden.</p>

        <span class="text-muted text-small">© 2026 CallDibs</span>

    </div>
</footer>
</html>
