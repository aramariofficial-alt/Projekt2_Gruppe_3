<!-- create.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Wishlist</title>
    <link rel="stylesheet" href="../static/styles.css" th:href="@{../static/styles.css}">
</head>
<body>
<header>
    <div class="container">

        <nav class="row" >
            <a class="logo">CallDibs </a>
            <span>Mine ønskelister</span>
        </nav>

        <div class="section">
            <p class="label">Små ønsker. Store smil.</p>

            <h1>
                Gør plads til det,<br>
                du glæder dig til.
            </h1>

            <p>
                Saml dine ønsker ét sted, og gør det nemt<br>
                for dine nærmeste at finde den rette gave.
            </p>

            <a class="btn btn-light" href="#ny-liste">
                + Opret ønskeliste
            </a>
        </div>

    </div>
</header>
<div class="create-box">
    <div class="create-box-form">
        <h2>Create a New wishlist</h2>
        <form th:action="@{/static}" method="post">
            <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter name of wishlist" required>
            </div>
            <button class="btn-light, btn" type="submit">Create Wishlist</button>
        </form>
    </div>
</div>
</body>
</html>
