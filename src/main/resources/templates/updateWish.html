<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opdater ønske</title>
    <link rel="stylesheet" href="../static/styles.css" th:href="@{styles.css}">
</head>

<body>

<header>
    <div class="container">

        <nav class="row">
            <a href="index.html" th:href="@{/}" class="logo">
                <img src="../static/img/logo.png"
                     th:src="@{/img/logo.png}"
                     class="logo-img"
                     alt="CallDibs logo">
            </a>

            <a class="logo">CallDibs</a>
            <span> </span>

        </nav>

        <div class="section">

            <p>
                Ret oplysningerne om dit ønske<br>
                og hold ønskelisten opdateret.
            </p>

        </div>

    </div>
</header>

<div class="create-box">

    <div class="create-box-form">

        <h2>Opdater ønske</h2>

        <form th:action="@{/saveUpdateWish}" method="post">

            <input type="hidden" name="id" th:value="${wish.id}">
            <input type="hidden" name="wishlistId" th:value="${wish.wishlistId}">

            <div>
                <label for="name">Navn:</label>
                <input type="text"
                       id="name"
                       name="name"
                       th:value="${wish.getName()}"
                       placeholder="Skriv ønskets navn"
                       required>
            </div>

            <div>
                <label for="description">Beskrivelse:</label>
                <input type="text"
                       id="description"
                       name="description"
                       th:value="${wish.getDescription()}"
                       placeholder="Beskriv dit ønske"
                       required>
            </div>

            <div>
                <label for="price">Pris:</label>
                <input type="number"
                       id="price"
                       name="price"
                       th:value="${wish.getPrice()}"
                       placeholder="Angiv prisen i kroner"
                       required>
            </div>

            <div>
                <label for="link">Link:</label>
                <input type="text"
                       id="link"
                       name="link"
                       th:value="${wish.getLink()}"
                       placeholder="Indsæt et link til dit ønske"
                       required>
            </div>

            <div>
                <label for="category">Kategori:</label>

                <select id="category" name="category" required>
                    <option value="">-- Vælg kategori --</option>

                    <option value="Electronics"
                            th:selected="${wish.category == 'Electronics'}">
                        Elektronik
                    </option>

                    <option value="Kitchen"
                            th:selected="${wish.category == 'Kitchen'}">
                        Køkken
                    </option>

                    <option value="Clothing"
                            th:selected="${wish.category == 'Clothing'}">
                        Tøj
                    </option>

                    <option value="Sports"
                            th:selected="${wish.category == 'Sports'}">
                        Sport
                    </option>

                    <option value="Books"
                            th:selected="${wish.category == 'Books'}">
                        Bøger
                    </option>

                    <option value="Toys"
                            th:selected="${wish.category == 'Toys'}">
                        Legetøj
                    </option>

                    <option value="Other"
                            th:selected="${wish.category == 'Other'}">
                        Andet
                    </option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn btn-light" type="submit">
                    Opdater
                </button>

                <button class="btn btn-light"
                        type="button"
                        onclick="history.back()">
                    Annuller
                </button>
            </div>

        </form>

        <form th:action="@{/deleteWish}" method="post">

            <input type="hidden" name="id" th:value="${wish.id}">
            <input type="hidden" name="wishlistId" th:value="${wish.wishlistId}">

            <div class="button-group">
                <button class="btn btn-delete"
                        type="submit"
                        onclick="return confirm('Er du sikker på, at du vil slette dette ønske?')">
                    Slet
                </button>
            </div>

        </form>

    </div>

</div>

</body>

<footer>
    <div class="container row">

        <div>
            <a class="logo" href="index.html">CallDibs</a>
            <p class="text-muted text-small">Plads til dine ønsker.</p>
        </div>

        <p class="text-muted text-small">Saml. Ønsk. Del glæden.</p>

        <span class="text-muted text-small">© 2026 CallDibs</span>

    </div>
</footer>

</html>
